[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiji-mcp-server"
version = "0.2.0"
description = "Minimal MCP server for controlling Fiji/ImageJ through commands, IJM, Groovy, images, and results"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Suraj Sahu", email = "ssahu2@ucmerced.edu" }]
maintainers = [{ name = "Suraj Sahu", email = "ssahu2@ucmerced.edu" }]
keywords = ["fiji", "imagej", "mcp", "pyimagej", "microscopy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "fastmcp>=2.10.3,<3",
    "pyimagej>=1.5.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/surajinacademia/Fiji_imageJ_mcp"
Repository = "https://github.com/surajinacademia/Fiji_imageJ_mcp"
Documentation = "https://github.com/surajinacademia/Fiji_imageJ_mcp/tree/main/docs"
Changelog = "https://github.com/surajinacademia/Fiji_imageJ_mcp/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/surajinacademia/Fiji_imageJ_mcp/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "PyYAML>=6.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]
dev = [
    "ruff>=0.12.10",
    "mypy>=1.17.0,<2.0",
    "pre-commit>=4.3.0",
]
publish = [
    "build>=1.2.0",
    "twine>=5.0.0",
]
all = ["fiji-mcp-server[test,dev,publish]"]

[project.scripts]
fiji-mcp-server = "fiji_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fiji_mcp = ["py.typed"]

[tool.pytest.ini_options]
addopts = [
    "-q",
    "--strict-markers",
    "--tb=short",
]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: integration tests requiring local Fiji runtime",
    "mcp_stdio: subprocess MCP client over stdio (FastMCP Client)",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]
fix = false

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "TCH",
    "TID",
    "Q",
    "S",
    "D",
    "BLE",
    "A",
    "ISC",
    "G",
    "PIE",
]
ignore = [
    "E501",
    "BLE001",
    "S101",
    "S110",
    "SIM105",
    "SIM103",
    "S108",
    "TC003",
    "TC001",
    "TC002",
    "D",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S311", "D", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

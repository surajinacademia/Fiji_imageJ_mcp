name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (test + dev)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test,dev,publish]"

      - name: Ruff
        run: ruff check src/ tests/

      - name: Unit tests (exclude Fiji integration)
        run: python -m pytest -m "not integration" --tb=short

      - name: Build and validate distribution
        run: |
          python -m build
          python -m twine check dist/*
          python tests/wheel_smoke.py dist/fiji_mcp_server-0.2.0-py3-none-any.whl

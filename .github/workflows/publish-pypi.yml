# Publish sdist + wheel to PyPI when a GitHub Release is published.
# Configure PyPI: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
# PyPI trusted publisher: workflow filename publish-pypi.yml (see RELEASING.md).

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release source
        # Pinned to actions/checkout v4.4.0.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        # Pinned to actions/setup-python v5.6.0.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reviewed build and validation tools
        run: >-
          python -m pip install
          "pip==25.3"
          "setuptools==84.0.0"
          "wheel==0.45.1"
          "build==1.4.0"
          "twine==6.2.0"
          "fastmcp==2.14.3"

      - name: Build distribution
        run: python -m build --no-isolation

      - name: Freeze distribution artifact
        # Pinned to actions/upload-artifact v4.6.2. Upload before smoke tests so
        # freshly resolved runtime dependencies cannot alter what is published.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

      - name: Validate distribution
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel
        run: python tests/wheel_smoke.py dist/fiji_mcp_server-0.2.0-py3-none-any.whl

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download frozen distribution
        # Pinned to actions/download-artifact v4.3.0.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        # Pinned to v1.14.0 (2026-04-07); bump SHA when upgrading: https://github.com/pypa/gh-action-pypi-publish/releases
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        # PyPI Trusted Publishing (OIDC). If not configured, add a repo secret
        # PYPI_API_TOKEN and uncomment:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

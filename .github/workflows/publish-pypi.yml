# Publish sdist + wheel to PyPI when a GitHub Release is published.
# Configure PyPI: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
# PyPI trusted publisher: workflow filename publish-pypi.yml (see RELEASING.md).

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install distribution validators
        run: python -m pip install --upgrade pip build twine "fastmcp>=2.10.3"

      - name: Build and validate distribution
        run: |
          python -m build
          python -m twine check dist/*
          python tests/wheel_smoke.py dist/fiji_mcp_server-0.2.0-py3-none-any.whl

      - name: Publish to PyPI
        # Pinned to v1.14.0 (2026-04-07); bump SHA when upgrading: https://github.com/pypa/gh-action-pypi-publish/releases
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        # PyPI Trusted Publishing (OIDC). If not configured, add a repo secret
        # PYPI_API_TOKEN and uncomment:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
